name: Weekly signals and protected PWA

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.png'
      - '*.webmanifest'
      - 'weekly_engine.zip'
      - 'requirements-weekly.txt'
      - '.github/workflows/weekly.yml'
  schedule:
    # Beijing Friday 21:17, Saturday/Sunday 09:17. UTC cron; may be delayed.
    - cron: '17 13 * * 5'
    - cron: '17 1 * * 6,0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-weekly.txt
      - name: Install pinned calculation dependencies
        run: python -m pip install -r requirements-weekly.txt
      - name: Prepare engine and a static-only site artifact
        shell: python
        run: |
          import os, pathlib, shutil, zipfile
          engine = pathlib.Path(os.environ['RUNNER_TEMP']) / 'weekly-engine'
          with zipfile.ZipFile('weekly_engine.zip') as archive:
              archive.extractall(engine)
          site = pathlib.Path('_site')
          site.mkdir()
          for name in ['index.html','style.css','app.js','auth.js','sw.js','manifest.webmanifest',
                       'icon-192.png','icon-512.png','maskable-512.png','apple-touch-icon.png']:
              shutil.copy2(name, site / name)
          (site / '.nojekyll').touch()
      - name: Fetch complete weeks, audit and encrypt new signals
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python "$RUNNER_TEMP/weekly-engine/weekly_update.py" --site _site
      - name: Preserve the last verified encrypted snapshot
        run: |
          cp _site/data.enc.json data.enc.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data.enc.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update audited encrypted weekly snapshot'
            git push origin HEAD:main
          fi
      - name: Include the convertible-bond PWA in the shared Pages site
        run: python convertible-bond/scripts/build_site.py --site _site --cb-only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish only after successful data audits
        id: deployment
        uses: actions/deploy-pages@v4
